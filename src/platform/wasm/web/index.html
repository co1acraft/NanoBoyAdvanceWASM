<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NanoBoyAdvance - WebAssembly</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>NanoBoyAdvance</h1>
      <p class="subtitle">Game Boy Advance Emulator</p>
    </header>

    <div class="emulator-container">
      <canvas id="screen" width="240" height="160"></canvas>
      <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
        <p id="loading-text">Loading emulator...</p>
      </div>
    </div>

    <div class="controls-panel">
      <div class="file-inputs">
        <div class="file-input-group">
          <label for="bios-input" class="file-label">
            <span id="bios-status" class="status-icon">○</span>
            Load BIOS
          </label>
          <input type="file" id="bios-input" accept=".bin,.gba" style="display: none;">
        </div>
        
        <div class="file-input-group">
          <label for="rom-input" class="file-label">
            <span id="rom-status" class="status-icon">○</span>
            Load ROM
          </label>
          <input type="file" id="rom-input" accept=".gba,.zip" style="display: none;">
        </div>
      </div>

      <div class="action-buttons">
        <button id="start-btn" disabled>Start</button>
        <button id="pause-btn" disabled>Pause</button>
        <button id="reset-btn" disabled>Reset</button>
        <button id="fullscreen-btn">Fullscreen</button>
      </div>

      <div class="settings-row">
        <label>
          <input type="checkbox" id="skip-bios" checked>
          Skip BIOS
        </label>
        <label>
          Volume: <input type="range" id="volume" min="0" max="100" value="100">
        </label>
        <label>
          Scale:
          <select id="scale">
            <option value="1">1x (240×160)</option>
            <option value="2" selected>2x (480×320)</option>
            <option value="3">3x (720×480)</option>
            <option value="4">4x (960×640)</option>
          </select>
        </label>
      </div>
    </div>

    <div class="keyboard-controls">
      <h3>Keyboard Controls</h3>
      <div class="key-bindings">
        <div class="key-row">
          <span><kbd>X</kbd> A</span>
          <span><kbd>Z</kbd> B</span>
          <span><kbd>Enter</kbd> Start</span>
          <span><kbd>Shift</kbd> Select</span>
        </div>
        <div class="key-row">
          <span><kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> D-Pad</span>
          <span><kbd>A</kbd> L</span>
          <span><kbd>S</kbd> R</span>
        </div>
      </div>
    </div>

    <div class="save-controls">
      <button id="save-btn" disabled>Save to Browser</button>
      <button id="load-save-btn" disabled>Load Save</button>
      <button id="export-save-btn" disabled>Export Save</button>
      <input type="file" id="import-save-input" accept=".sav" style="display: none;">
      <button id="import-save-btn" disabled>Import Save</button>
    </div>

    <footer>
      <p>NanoBoyAdvance WASM Port | <a href="https://github.com/nba-emu/NanoBoyAdvance" target="_blank">GitHub</a></p>
      <p class="disclaimer">This emulator requires a GBA BIOS file to run.</p>
    </footer>
  </div>

  <script src="nba.js"></script>
  <script src="main.js"></script>
</body>
</html>
